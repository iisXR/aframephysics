<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebXR Physics & Super-Hands Experience</title>
  
  <!-- A-Frame Core -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  
  <!-- A-Frame Extras (Locomotion & Snap Turn) -->
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
  
  <!-- A-Frame Physics System -->
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
  
  <!-- Super-Hands Component -->
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-super-hands-component@master/dist/super-hands.min.js"></script>
  
  <!-- A-Frame Physics Extras (Connects Super-Hands to Cannon.js Physics Bodies) -->
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-extras@master/dist/aframe-physics-extras.min.js"></script>
  
  <!-- Custom Event Listener component for UI / visual feedback -->
  <script>
    AFRAME.registerComponent('grabbable-box', {
      init: function () {
        var el = this.el;
        
        el.addEventListener('hover-start', function () {
          el.setAttribute('material', 'wireframe', true);
        });
        el.addEventListener('hover-end', function () {
          el.setAttribute('material', 'wireframe', false);
        });
        el.addEventListener('grab-start', function () {
          el.setAttribute('material', 'color', '#32CD32'); // Bright lime on grab
        });
        el.addEventListener('grab-end', function () {
          el.setAttribute('material', 'color', '#2E8B57'); // Sea green default
        });
      }
    });
  </script>
</head>
<body>
  <a-scene 
    physics="debug: false; gravity: -9.8" 
    webxr="optionalFeatures: hit-test, local-floor;"
    background="color: #1a1a2e">
    
    <!-- Lighting -->
    <a-ambient-light color="#bbb"></a-ambient-light>
    <a-directional-light color="#ffffff" intensity="0.8" position="-1 4 2" cast-shadow="true"></a-directional-light>

    <!-- Player Rig with Locomotion (Left Stick) & Snap Turn (Right Stick) -->
    <a-entity 
      id="rig" 
      position="0 0 0" 
      movement-controls="controls: gamepad, keyboard; speed: 0.15;">
      
      <!-- Camera for Head Tracking & Desktop Navigation -->
      <a-camera id="head" position="0 1.6 0" look-controls>
        <!-- Mouse/Touch Super-Hands Cursor for Desktop Testing -->
        <a-entity 
          cursor="rayOrigin: mouse"
          raycaster="objects: .grabbable"
          super-hands="
            colliderEvent: raycaster-intersection;
            colliderEventProperty: els;
            colliderEndEvent: raycaster-intersection-cleared;
            colliderEndEventProperty: clearedEls;">
        </a-entity>
      </a-camera>

      <!-- Left Hand VR Controller -->
      <a-entity 
        id="leftHand"
        hand-controls="hand: left"
        rotation="-45 0 0"
        static-body="shape: sphere; sphereRadius: 0.1"
        physics-collider
        sphere-collider="objects: .grabbable; radius: 0.15"
        super-hands="
          colliderEvent: collisions;
          colliderEventProperty: collisions;
          colliderEndEvent: collisions;
          colliderEndEventProperty: clearedEls;
          grabStartButtons: triggerdown, gripdown;
          grabEndButtons: triggerup, gripup;">
      </a-entity>

      <!-- Right Hand VR Controller -->
      <a-entity 
        id="rightHand"
        hand-controls="hand: right"
        rotation="45 0 0"
        static-body="shape: sphere; sphereRadius: 0.1"
        physics-collider
        sphere-collider="objects: .grabbable; radius: 0.15"
        super-hands="
          colliderEvent: collisions;
          colliderEventProperty: collisions;
          colliderEndEvent: collisions;
          colliderEndEventProperty: clearedEls;
          grabStartButtons: triggerdown, gripdown;
          grabEndButtons: triggerup, gripup;"
        snap-turn="target: #rig; turnAngle: 30">
      </a-entity>
    </a-entity>

    <!-- Floor (Static Physics Body) -->
    <a-plane 
      position="0 0 0" 
      rotation="-90 0 0" 
      width="30" 
      height="30" 
      color="#222" 
      static-body 
      shadow="receive: true">
    </a-plane>

    <!-- Interactive Green Boxes (Dynamic Physics + Grabbable / Stretchable) -->
    <a-box 
      class="grabbable" 
      grabbable-box
      position="-0.8 1.2 -2" 
      rotation="0 45 0" 
      width="0.5" height="0.5" depth="0.5" 
      color="#2E8B57" 
      dynamic-body="shape: box; mass: 2"
      grabbable stretchable hoverable
      shadow="cast: true">
    </a-box>

    <a-box 
      class="grabbable" 
      grabbable-box
      position="0 1.5 -2" 
      rotation="15 20 0" 
      width="0.6" height="0.6" depth="0.6" 
      color="#3CB371" 
      dynamic-body="shape: box; mass: 3"
      grabbable stretchable hoverable
      shadow="cast: true">
    </a-box>

    <a-box 
      class="grabbable" 
      grabbable-box
      position="0.8 1.0 -2" 
      rotation="0 10 0" 
      width="0.4" height="0.4" depth="0.4" 
      color="#00FF7F" 
      dynamic-body="shape: box; mass: 1"
      grabbable stretchable hoverable
      shadow="cast: true">
    </a-box>

    <!-- Table pedestal to hold boxes initially -->
    <a-box 
      position="0 0.4 -2" 
      width="2.5" height="0.8" depth="1" 
      color="#444" 
      static-body 
      shadow="receive: true; cast: true">
    </a-box>

  </a-scene>
</body>
</html>
